apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-ranking-api
  labels:
    app: resume-ranking-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resume-ranking-api
  template:
    metadata:
      labels:
        app: resume-ranking-api
    spec:
      containers:
        - name: api
          image: resume-candidate-ranking-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg://resume:resume@host.docker.internal:5432/resume
            - name: WEAVIATE_HOST
              value: host.docker.internal
            - name: WEAVIATE_PORT
              value: "8080"
            - name: NEO4J_URI
              value: bolt://host.docker.internal:7687
            - name: NEO4J_USER
              value: neo4j
            - name: NEO4J_PASSWORD
              value: resume-dev-only
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: resume-ranking-api
spec:
  selector:
    app: resume-ranking-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
